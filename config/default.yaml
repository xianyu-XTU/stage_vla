# ============================================================================
# 默认配置（唯一配置源 · 机器无关）
# 基于阶段感知强化学习的轻量化 VLA 机械臂研究（stage_vla v2）
# ----------------------------------------------------------------------------
# 本文件只含占位符，不含任何真实盘符路径。
# 真实路径写在 config.local.yaml（gitignored），由 core.config 三层合并覆盖。
# 修改后无需改代码，重启训练/推理即生效。
# ============================================================================

# ---------- 项目基本信息 ----------
project:
  name: "基于阶段感知强化学习的轻量化VLA机械臂研究"
  outputs: "outputs"

# ---------- 环境与模型路径（<local> 占位，由 config.local.yaml 覆盖） ----------
paths:
  isaaclab: "<local>/IsaacLab"                          # Isaac Lab 3.0.0 源码
  isaac_sim: "<local>/isaac-sim-standalone"             # Isaac Sim 独立版
  openvla_root: "<local>/openvla"                       # OpenVLA 根（含 prismatic）
  openvla_model: "<local>/openvla-7b"                   # OpenVLA-7B 权重
  rdt_model: "<local>/rdt-1b"                           # RDT-1B 权重
  siglip_model: "<local>/siglip"                        # SigLIP 视觉编码器
  t5_model: "<local>/t5-xxl"                            # T5-XXL 语言编码器
  lang_embed: "<local>/lang_embed.pt"                   # 预编码语言嵌入
  vision_only_dir: "<local>/openvla_vision_only"        # 剥离 LLM 的视觉模型（vision_only.pt + meta.pt）
  rdt_repo: "<local>/rdt_repo"                          # RDT 推理代码（拷贝引入，非嵌套仓库）

# ---------- 任务定义 ----------
task:
  id_state: "Isaac-Stack-Cube-Franka-IK-Rel-v0"         # 状态版（阶段感知 PPO 训练）
  id_joint: "Isaac-Stack-Cube-Franka-v0"                # 关节位置控制版（RDT 开环用）
  id_visuomotor: "Isaac-Stack-Cube-Franka-IK-Rel-Visuomotor-v0"  # 视觉版
  desc: "pick up the red cube and place it on the blue cube"
  cube_to_grasp: "cube_2"      # 要抓的方块（红色）
  cube_to_stack_on: "cube_1"   # 放置底座（蓝色）

# ---------- 阶段划分（长程任务子阶段，顺序固定） ----------
stages:
  - approach   # 接近
  - grasp      # 抓取
  - lift       # 抬起
  - move       # 移动
  - stack      # 堆叠

# 各阶段切换阈值（米 / 弧度）
thresholds:
  approach_dist: 0.15      # 末端到目标方块水平距离 < 此值视为接近完成
  grasp_reward_thresh: 0.5 # 抓取布尔信号阈值
  lift_height: 0.06        # 方块抬离桌面高度阈值
  place_align_dist: 0.05   # 与底座方块水平对齐阈值
  lift_min_height: 0.04    # 方块被抬起判定阈值（root z > 此值 = 已离桌面）

# ---------- 阶段感知奖励权重 ----------
# 键名与 stages 一一对应；stage_transition 在跨入新阶段时一次性给
reward_weights:
  action_penalty: -0.01    # 动作平滑惩罚（action_l2）
  progress_shaping: 1.0    # 阶段势能塑形（每步稠密信号）总权重
  approach: 0.0            # 接近（靠塑形引导，不给完成奖）
  grasp: 2.0               # 抓取完成
  lift: 1.0                # 抬起完成
  move: 0.5                # 移动对齐完成
  stack: 10.0              # 堆叠完成（最终目标）
  lift_object: 15.0        # 方块被抬起(高于阈值)每步重奖 —— 官方 Isaac-Lift 机制，驱动真抓取

# ---------- PPO 训练超参（rsl_rl 5.x） ----------
ppo:
  seed: 42
  num_envs: 128            # 并行环境数（8GB 显存建议 64~256）
  num_steps_per_env: 24
  max_iterations: 1000
  save_interval: 100
  learning_rate: 1.0e-3
  num_learning_epochs: 5
  num_mini_batches: 4
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  init_noise_std: 0.3            # 调小随机动作幅度，减少随机游走漂移对塑形的扰动（M1 实验调优）
  actor_hidden_dims: [512, 512, 256]
  critic_hidden_dims: [512, 512, 256]
  activation: "elu"
  experiment_name: "stage_vla_stack"

# ---------- StARe-RL 与 VLA 融合（模块②，M0 预留） ----------
rl:
  vla:
    enabled: false                  # M2 融合训练开关
    vla_backend: "vision_only"      # 8GB 显存默认 vision_only（OpenVLA-7B 4bit≈4.1GB 与渲染不可共存）
    # 融合训练闭环方式：in_sim（同进程，仅 vision_only 可行）/ record_replay / tcp_separate
    loop_mode: "record_replay"

# ---------- 模型轻量化参数（模块③） ----------
lightweight:
  lora_rank: 16            # LoRA 秩
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  quant_bits: 4            # 运行时量化位宽（4=NF4；8 尚未实现，见 lightweight.quantize）
  # INT8 与知识蒸馏为 M3 预留字段（当前仅记录意向，不生效）
  int8:
    enabled: false
    method: "optimum_gptq"          # 候选：optimum_gptq / awq / torch_ao，接入前调研
  distill:
    enabled: false
    teacher_model: "openvla-7b"
    student_backend: "vision_only"  # 候选：vision_only / lora_int8
    temperature: 3.0
    alpha: 0.5                      # 蒸馏 loss 与任务 loss 的平衡系数

# ---------- RDT 归一化边界（8 维 = 7 关节 + 夹爪） ----------
rdt_normalization:
  state_min: [-0.7463043928146362, -0.0801204964518547, -0.4976441562175751, -2.657780647277832, -0.5742632150650024, 1.8309762477874756, -2.2423808574676514, 0.0]
  state_max: [0.7645499110221863, 1.4967026710510254, 0.4650936424732208, -0.3866899907588959, 0.5505855679512024, 3.2900545597076416, 2.5737812519073486, 0.03999999910593033]
  action_min: [-0.7472005486488342, -0.08631071448326111, -0.4995281398296356, -2.658363103866577, -0.5751323103904724, 1.8290787935256958, -2.245187997817993, -1.0]
  action_max: [0.7654682397842407, 1.4984270334243774, 0.46786263585090637, -0.38181185722351074, 0.5517147779464722, 3.291581630706787, 2.575840711593628, 1.0]

# ---------- RDT 推理参数 ----------
rdt_inference:
  control_frequency: 25.0
  horizon: 64             # 动作块长度
  replan_every: 8         # 重规划间隔
  num_views: 3            # RDT 位置嵌入固定 3视角×2帧=6 张图（4374 tokens）
  hist_len: 2             # 历史帧数

# ---------- 仿真后端（M4 预留） ----------
sim:
  backend: "isaac_lab"    # 候选：isaac_lab / gazebo / maniskill

# ---------- 部署（deploy/server.py） ----------
deploy:
  server:
    host: "127.0.0.1"
    port: 8765
