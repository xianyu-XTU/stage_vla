[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage_vla"
version = "0.1.0"
description = "基于阶段感知强化学习的轻量化 VLA 机械臂研究（湘潭大学创新训练项目）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "湘潭大学 stage_vla 项目组", email = "3426526340@qq.com" },
]

[project.optional-dependencies]
# 运行时依赖在 Isaac Sim kit python 中，见 README「环境依赖」。
# 此处的依赖分组仅作记录；不要在此写入机器相关路径。
dev = ["pytest>=7", "ruff>=0.4"]
core = ["numpy", "torch", "pyyaml"]
isaac = ["isaaclab", "rsl_rl"]
vla = ["transformers", "peft", "bitsandbytes", "prismatic"]

[tool.setuptools.packages.find]
include = ["stage_vla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 允许相对导入 tests 下的本地包（如需）
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
